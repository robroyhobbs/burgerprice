name: Deploy Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT_ID: gen-lang-client-0405402450
  REGION: us-central1
  SERVICE: burgerprice-web
  ARTIFACT_REPO: burgerprice
  CLOUDSQL_INSTANCE: gen-lang-client-0405402450:us-central1:burgerprice-db
  RUNTIME_SA: burgerprice-run@gen-lang-client-0405402450.iam.gserviceaccount.com
  CANARY_TAG: canary

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPO}/${SERVICE}:${GITHUB_SHA}"
          docker build -t "${IMAGE}" .
          docker push "${IMAGE}"
          echo "IMAGE=${IMAGE}" >> "${GITHUB_ENV}"

      - name: Record current production traffic (rollback target)
        id: prior
        run: |
          set -euo pipefail
          gcloud run services describe "${SERVICE}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --format=json > /tmp/service-before.json
          PRIOR_REV="$(python3 -c '
          import json
          d = json.load(open("/tmp/service-before.json"))
          traffic = d.get("status", {}).get("traffic") or []
          prod = [t for t in traffic if (t.get("percent") or 0) > 0 and not t.get("tag")]
          if not prod:
              prod = [t for t in traffic if (t.get("percent") or 0) > 0]
          print((prod[0].get("revisionName") or "") if prod else "")
          ')"
          echo "revision=${PRIOR_REV}" >> "${GITHUB_OUTPUT}"
          echo "Prior production revision (rollback target): ${PRIOR_REV:-unknown}"

      - name: Deploy to Cloud Run (no traffic, canary tag)
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          project_id: ${{ env.PROJECT_ID }}
          image: ${{ env.IMAGE }}
          no_traffic: true
          tag: ${{ env.CANARY_TAG }}
          wait: true
          env_vars: |-
            NODE_ENV=production
            REQUIRE_DATABASE=true
            NEXT_PUBLIC_BASE_URL=https://burgerprice.com
            GOOGLE_CLOUD_PROJECT=gen-lang-client-0405402450
            GOOGLE_CLOUD_LOCATION=us-central1
            GEMINI_MODEL=gemini-2.0-flash
          secrets: |-
            DATABASE_URL=DATABASE_URL:latest
            CRON_SECRET=CRON_SECRET:latest
          flags: >-
            --port=8080
            --cpu=1
            --memory=512Mi
            --min-instances=0
            --add-cloudsql-instances=${{ env.CLOUDSQL_INSTANCE }}
            --service-account=${{ env.RUNTIME_SA }}

      - name: Resolve canary URL
        id: canary
        run: |
          set -euo pipefail
          gcloud run services describe "${SERVICE}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --format=json > /tmp/service-after.json
          CANARY_URL="$(python3 -c '
          import json, os, sys
          tag = os.environ["CANARY_TAG"]
          d = json.load(open("/tmp/service-after.json"))
          traffic = d.get("status", {}).get("traffic") or []
          for t in traffic:
              if t.get("tag") == tag and t.get("url"):
                  print(t["url"])
                  break
          else:
              base = (d.get("status") or {}).get("url") or ""
              if base.startswith("https://"):
                  print("https://" + tag + "---" + base[len("https://"):])
              else:
                  sys.exit("could not resolve canary URL")
          ')"
          NEW_REV="$(python3 -c '
          import json, os
          tag = os.environ["CANARY_TAG"]
          d = json.load(open("/tmp/service-after.json"))
          traffic = d.get("status", {}).get("traffic") or []
          for t in traffic:
              if t.get("tag") == tag and t.get("revisionName"):
                  print(t["revisionName"])
                  break
          else:
              print((d.get("status") or {}).get("latestCreatedRevisionName") or "")
          ')"
          echo "url=${CANARY_URL}" >> "${GITHUB_OUTPUT}"
          echo "revision=${NEW_REV}" >> "${GITHUB_OUTPUT}"
          echo "Canary URL: ${CANARY_URL}"
          echo "Canary revision: ${NEW_REV}"
          echo "Service URL (not used for smoke): ${{ steps.deploy.outputs.url }}"

      - name: Smoke check canary /api/health
        id: smoke
        run: |
          set -euo pipefail
          URL="${{ steps.canary.outputs.url }}/api/health"
          echo "GET ${URL}"
          echo "Rollback target if this fails: ${{ steps.prior.outputs.revision }}"
          for i in 1 2 3 4 5 6 7 8; do
            BODY="$(curl -fsS --retry 2 --retry-delay 2 "${URL}" || true)"
            echo "attempt ${i}: ${BODY}"
            if [ -z "${BODY}" ]; then
              sleep 10
              continue
            fi
            printf '%s' "${BODY}" > /tmp/health.json
            if python3 -c '
          import json, sys
          d = json.load(open("/tmp/health.json"))
          ok = (
              d.get("status") == "ok"
              and d.get("mode") == "database"
              and d.get("database") == "connected"
          )
          cities = d.get("cities")
          if ok and cities is not None and int(cities) == 0:
              print("Smoke fail: cities==0", file=sys.stderr)
              sys.exit(1)
          sys.exit(0 if ok else 1)
          '; then
              echo "Canary smoke check passed."
              exit 0
            fi
            sleep 10
          done
          echo "Canary smoke check failed."
          echo "Expected: status=ok AND mode=database AND database=connected (and cities!=0 if present)."
          echo "NOT promoting traffic. Prior production revision left in place: ${{ steps.prior.outputs.revision }}"
          echo "Failed canary revision: ${{ steps.canary.outputs.revision }}"
          exit 1

      - name: Promote canary to 100% traffic
        run: |
          set -euo pipefail
          echo "Promoting latest revision to 100% traffic..."
          echo "New revision: ${{ steps.canary.outputs.revision }}"
          echo "Previous production revision: ${{ steps.prior.outputs.revision }}"
          gcloud run services update-traffic "${SERVICE}" \
            --project="${PROJECT_ID}" \
            --region="${REGION}" \
            --to-latest
          echo "Traffic promoted to latest (100%)."
